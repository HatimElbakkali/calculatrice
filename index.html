<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <div class="container">
        <div class="calculatrice">
            <div class="header-calculatrice">
                <h1 class="displayed"></h1>
            </div>
            <div class="body-calculatrice">
                <div class="btn-calculatrice orange">+</div>
                <div class="btn-calculatrice grey">9</div>
                <div class="btn-calculatrice grey">8</div>
                <div class="btn-calculatrice grey">7</div>
                <div class="btn-calculatrice orange">-</div>
                <div class="btn-calculatrice grey">6</div>
                <div class="btn-calculatrice grey">5</div>
                <div class="btn-calculatrice grey">4</div>
                <div class="btn-calculatrice orange">*</div>
                <div class="btn-calculatrice grey">3</div>
                <div class="btn-calculatrice grey">2</div>
                <div class="btn-calculatrice grey">1</div>
                <div class="btn-calculatrice orange">/</div>
                <div class="btn-calculatrice grey">0</div>
                <div class="btn-calculatrice orange">.</div>
                <div id="orange" class="btn-calculatrice result">=</div>
                <div class="btn-calculatrice red">C</div>
                <div class="btn-calculatrice red">X</div>
            </div>
        </div>
    </div>
    <script type="module" src="script/calculatrice.js"></script>
</body>
</html>
